server:
  port: ${PORT:8084}

spring:
  application:
    name: ms-ventas
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:ventasdb}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

api:
  productos:
    url: ${API_PRODUCTOS_URL:http://localhost:8087/api/v1/productos/}
  inventario:
    url: ${API_INVENTARIO_URL:http://localhost:8083/api/v1/inventario/}

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /api-docs
