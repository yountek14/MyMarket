spring.application.name=ms-alertas
server.port=8085

spring.datasource.url=jdbc:h2:mem:alertasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

api.inventario.url=${API_INVENTARIO_URL:http://localhost:8083/api/v1/inventario/}
api.productos.url=${API_PRODUCTOS_URL:http://localhost:8087/api/v1/productos/}

springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs