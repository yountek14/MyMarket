server:
  port: ${PORT:8086}

spring:
  application:
    name: ms-precios
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:preciosdb}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /api-docs
